name: Release

# Push a tag like v0.1.0 to build both artifacts from that exact commit,
# attach SHA-256 checksums and signed build provenance, and open a DRAFT release.
# Review the draft on GitHub, then publish it by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write       # create the draft release
      id-token: write       # sign the provenance attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r bridge/requirements-dev.txt

      - name: Tag matches source versions
        run: python tools/check_version.py "${{ github.ref_name }}"

      - name: Tests
        run: |
          python -m unittest discover -s bridge -p "test_*.py"
          python -m unittest discover -s extension/tests -p "test_*.py"

      - name: Build bridge executable
        working-directory: bridge
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --name PixelsFGU-Bridge
          --collect-submodules bleak --collect-all winrt
          --distpath ../dist --workpath ../build --specpath ../build
          pixels_bridge.py

      - name: Package extension
        run: python tools/package_ext.py

      - name: Bundle, checksums and release notes
        run: python tools/make_release.py "${{ github.ref_name }}" "${{ github.repository }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/PixelsInFGU-*-windows.zip
            dist/PixelsFGU-Bridge.exe
            dist/PixelsFGU.ext

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $bundle = Get-ChildItem dist/PixelsInFGU-*-windows.zip | Select-Object -First 1
          gh release create "$env:TAG" --draft --verify-tag --title "PixelsInFGU $env:TAG" `
            --notes-file dist/release-notes.md `
            $bundle.FullName dist/PixelsFGU-Bridge.exe dist/PixelsFGU.ext dist/SHA256SUMS.txt
