name: Release

# Push a tag like v0.1.0 to build the bridge for Windows, macOS and Linux and the
# extension from that exact commit, attach SHA-256 checksums and signed build
# provenance, and open a DRAFT release. Review the draft on GitHub, then publish it by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge (${{ matrix.binary }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            binary: PixelsFGU-Bridge.exe
            collect: --collect-all winrt
          - os: macos-latest          # Apple silicon
            binary: PixelsFGU-Bridge-macos-arm64
            collect: --collect-submodules CoreBluetooth --collect-submodules libdispatch
          - os: macos-15-intel        # Intel Macs
            binary: PixelsFGU-Bridge-macos-x86_64
            collect: --collect-submodules CoreBluetooth --collect-submodules libdispatch
          - os: ubuntu-22.04          # older glibc so the binary runs on more distros
            binary: PixelsFGU-Bridge-linux-x86_64
            collect: --collect-submodules dbus_fast
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r bridge/requirements-dev.txt

      - name: Tag matches source versions
        run: python tools/check_version.py "${{ github.ref_name }}"

      - name: Tests
        run: |
          python -m unittest discover -s bridge -p "test_*.py"
          python -m unittest discover -s extension/tests -p "test_*.py"

      - name: Build bridge executable
        working-directory: bridge
        shell: bash
        run: |
          name="${{ matrix.binary }}"
          python -m PyInstaller --noconfirm --clean --onefile --name "${name%.exe}" \
            --collect-submodules bleak ${{ matrix.collect }} \
            --distpath ../dist --workpath ../build --specpath ../build \
            pixels_bridge.py
          ../dist/"$name" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: bridge
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the draft release
      id-token: write       # sign the provenance attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Collect bridge executables
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package extension
        run: python tools/package_ext.py

      - name: Bundles, checksums and release notes
        run: python tools/make_release.py "${{ github.ref_name }}" "${{ github.repository }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/PixelsInFGU-*.zip
            dist/PixelsFGU-Bridge*
            dist/PixelsFGU.ext

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "PixelsInFGU $TAG" \
            --notes-file dist/release-notes.md \
            dist/PixelsInFGU-*.zip dist/PixelsFGU-Bridge* dist/PixelsFGU.ext dist/SHA256SUMS.txt
