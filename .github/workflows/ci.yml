name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r bridge/requirements-dev.txt

      - name: Versions match
        run: python tools/check_version.py

      - name: Bridge tests
        run: python -m unittest discover -s bridge -p "test_*.py" -v

      - name: Extension tests (Lua)
        run: python -m unittest discover -s extension/tests -p "test_*.py" -v

      - name: Package extension
        run: python tools/package_ext.py
